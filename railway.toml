[build]
builder = "NIXPACKS"

[deploy]
# منطق التشغيل في سكربت خارجي مرن (railway-start.sh):
# ينتظر جاهزية قاعدة البيانات مع إعادة المحاولة، ولا يُسقط الحاوية إن لم تجهز،
# ثم ينفّذ migrate + ProductionSeeder + الكاش، ويُبقي التطبيق Online في كل الأحوال.
startCommand = "/bin/bash railway-start.sh"
